[project]
name = "candidate-reranker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eduard Šimon", email = "eda.simon14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "whisper-normalizer>=0.1.15",
